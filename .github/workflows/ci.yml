name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published immutable release to recover
        required: true
        type: string
      expected_commit:
        description: Exact accepted main commit of the release tag
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm
        run: npm install --global npm@12.1.0
      - name: Install
        run: npm ci
      - name: Check exact revision
        env:
          PATCH_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PATCH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run check
  change-id:
    name: change-id
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - name: Validate PR identity
        run: node scripts/check-pr-identity.mjs
  release-tag:
    name: release-tag
    needs: verify
    if: github.event_name == 'push'
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - name: Create immutable release tag when version changes
        id: release-tag
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-tag.mjs --before "${{ github.event.before }}" --after "$GITHUB_SHA" --push-origin
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if git show-ref --verify --quiet "refs/tags/$tag" \
            && test "$(git cat-file -t "refs/tags/$tag")" = "tag" \
            && test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$GITHUB_SHA"; then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: release
    needs: [verify, release-tag]
    if: >-
      always() && needs.verify.result == 'success' &&
      ((github.event_name == 'push' && needs.release-tag.result == 'success' && needs.release-tag.outputs.tag != '') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || needs.release-tag.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm
        run: npm install --global npm@12.1.0
      - name: Install exact tagged dependencies
        run: npm ci
      - name: Check exact tagged state
        run: npm run check
      - name: Verify exact release identity
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || needs.release-tag.outputs.tag }}
          EXPECTED_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_commit || github.sha }}
        run: |
          set -euo pipefail
          npm run verify:release-identity -- "$RELEASE_TAG"
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          git fetch origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$EXPECTED_COMMIT" refs/remotes/origin/main
      - name: Publish or verify immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || needs.release-tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          verify_release() {
            test "$(gh release view "$RELEASE_TAG" --json tagName --jq '.tagName')" = "$RELEASE_TAG"
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = "false"
            test "$(gh release view "$RELEASE_TAG" --json isPrerelease --jq '.isPrerelease')" = "false"
          }

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            verify_release
            echo "GitHub Release already matches immutable tag: $RELEASE_TAG"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
          else
            echo "::error::Recovery requires an existing published GitHub Release: $RELEASE_TAG"
            exit 1
          fi

          verify_release

  deploy-production:
    name: deploy-production
    needs: [verify, release-tag, release]
    if: >-
      always() && needs.verify.result == 'success' && needs.release.result == 'success' &&
      ((github.event_name == 'push' && needs.release-tag.result == 'success' && needs.release-tag.outputs.tag != '') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    permissions:
      contents: read
    # Baseline's one tag-to-production path, pinned to a merged baseline commit. A called workflow sees only the
    # secrets its caller passes, so the call inherits them; its deploy job reads only the production environment's
    # Cloudflare token, and this repository keeps no repository-level secrets.
    uses: Wizard-Gang/baseline/.github/workflows/deploy-worker.yml@67b4b86847e0d635a3f6fe4c21618a25d5bc71a0
    secrets: inherit
    with:
      worker: wizardgang
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || needs.release-tag.outputs.tag }}
      expected_sha: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_commit || github.sha }}
